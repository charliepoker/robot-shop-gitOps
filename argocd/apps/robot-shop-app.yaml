---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: robot-shop
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: robot-shop
spec:
  project: default
  source:
    repoURL: https://github.com/charliepoker/robot-shop-gitops.git
    targetRevision: main
    path: argocd/manifests/robot-shop
  destination:
    server: https://kubernetes.default.svc
    namespace: robot-shop
  # ── Critical for the canary ──────────────────────────────────────────────
  # Argo Rollouts mutates live objects that ArgoCD also manages. Without these,
  # selfHeal reverts the controller's edits mid-rollout and traffic routing
  # breaks. Scoped by name so nothing else in the app is affected.
  ignoreDifferences:
    - group: ""
      kind: Service
      name: web
      jsonPointers:
        - /spec/selector          # Rollouts injects rollouts-pod-template-hash
    - group: ""
      kind: Service
      name: web-canary
      jsonPointers:
        - /spec/selector
    - group: networking.k8s.io
      kind: Ingress
      name: robot-shop
      jqPathExpressions:
        - '.metadata.annotations."alb.ingress.kubernetes.io/actions.web"'  # weight rewrites
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m