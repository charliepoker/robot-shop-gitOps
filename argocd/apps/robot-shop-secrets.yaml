---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: robot-shop-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: robot-shop

spec:
  project: default

  source:
    repoURL: https://github.com/charliepoker/robot-shop-gitops.git
    targetRevision: main
    path: argocd/manifests/secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: robot-shop

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      # Namespaces are declared in this directory at sync-wave -1, so ArgoCD
      # must not create them implicitly — that would omit the pod-security labels.
      - CreateNamespace=false
      - ServerSideApply=true
      - PruneLast=true

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  # Secrets created by ESO are owned by the ExternalSecret controller, not git.
  # Without this the app reports permanently OutOfSync.
  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data