# Grafana admin credential: AWS Secrets Manager -> ESO -> K8s Secret -> Grafana.
#
# Source:  robot-shop/grafana-admin (created by Terraform in
#          modules/secrets-manager/observability-secrets.tf, encrypted with
#          the S3 CMK, readable by the ESO Pod Identity role only).
# Target:  Secret monitoring/grafana-admin with the exact keys the Grafana
#          chart expects (grafana.admin.userKey / passwordKey).
#

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: Opaque
      data:
        admin-user: "{{ .GRAFANA_ADMIN_USER }}"
        admin-password: "{{ .GRAFANA_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: robot-shop/grafana-admin