# Secrets consumed by the observability stack, projected from AWS Secrets
# Manager by External Secrets Operator. Same pattern as robot-shop-secrets:
# Terraform generates + stores the credential, ESO syncs it, nothing
# sensitive ever lands in Git.
#
#
# Kept as a SEPARATE Application from kube-prometheus-stack because
# ExternalSecrets depend on the ClusterSecretStore (wave 0), while the chart
# syncs earlier (wave -3) so its CRDs exist before anything ships a
# ServiceMonitor. Grafana simply waits (CreateContainerConfigError, then
# starts) until the Secret appears — self-healing, no manual step.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # alongside the ClusterSecretStore
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: observability
spec:
  project: default

  source:
    repoURL: https://github.com/charliepoker/robot-shop-gitops.git
    targetRevision: main
    path: argocd/manifests/monitoring-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The monitoring namespace (with its pod-security labels) is owned by
      # the kube-prometheus-stack Application. Creating it here too would
      # give two apps competing ownership of one object.
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  # ESO propagates the ExternalSecret's annotations (including ArgoCD's
  # tracking id) onto the Secret it creates, so ArgoCD sees the Secret as
  # "its" resource and diffs data it never declared. The data is owned by
  # ESO, not Git.
  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data