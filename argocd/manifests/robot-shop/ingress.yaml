---
# Ingress for the Robot Shop web frontend: shop.devopsportfolio.com over HTTPS.
#
# Provisioned by the AWS Load Balancer Controller (ingressClassName: alb). TLS
# terminates at the ALB using the wildcard *.devopsportfolio.com ACM cert.
# ExternalDNS creates the shop.devopsportfolio.com A/ALIAS record automatically.
#
# CHANGED FOR CANARY (vs Phase 3):
#   1. backend port is now `use-annotation` (not 8080). This tells the ALB
#      controller to route via the actions.web annotation instead of a plain
#      service.
#   2. A seed `actions.web` annotation forwards 100% to the stable `web` service
#      so the Ingress is valid from t0. Argo Rollouts REWRITES this annotation
#      during a rollout to add web-canary at the current weight, then restores
#      100%→web when the rollout finishes. (ignoreDifferences in robot-shop-app
#      stops selfHeal from fighting that.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: robot-shop
  namespace: robot-shop
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:448049792905:certificate/292d8b16-6fbe-4536-983e-65997ed39049"
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-port: "8080"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/group.name: devopsportfolio-shared
    external-dns.alpha.kubernetes.io/hostname: shop.devopsportfolio.com
    # Seed action — Argo Rollouts manages this during rollouts.
    alb.ingress.kubernetes.io/actions.web: |
      {"type":"forward","forwardConfig":{"targetGroups":[{"serviceName":"web","servicePort":"8080","weight":100}]}}
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: robot-shop
spec:
  ingressClassName: alb
  rules:
    - host: shop.devopsportfolio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: use-annotation