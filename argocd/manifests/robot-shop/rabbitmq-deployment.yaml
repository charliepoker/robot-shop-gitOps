---
# In-cluster RabbitMQ (official image). Broker between payment (publisher) and
# dispatch (consumer). Ephemeral; queue contents are disposable for the demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: robot-shop
  labels:
    service: rabbitmq
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: robot-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      service: rabbitmq
  template:
    metadata:
      labels:
        service: rabbitmq
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: robot-shop
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
      restartPolicy: Always
