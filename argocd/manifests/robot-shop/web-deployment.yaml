---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: robot-shop
  labels:
    service: web
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: robot-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      service: web
  template:
    metadata:
      labels:
        service: web
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: robot-shop
    spec:
      containers:
        - name: web
          image: robotshop/rs-web:2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 50Mi
            limits:
              cpu: 200m
              memory: 100Mi
      restartPolicy: Always
