---
# In-cluster MongoDB. Uses the robotshop rs-mongodb image because it ships the
# seeded 'catalogue' and 'users' databases the app expects. Ephemeral: no PVC,
# so data resets on pod restart. Acceptable for a demo (catalogue re-seeds from
# the image; user data is disposable). Kept in-cluster deliberately — DocumentDB
# would add ~$200/mo for no portfolio benefit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: robot-shop
  labels:
    service: mongodb
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: robot-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      service: mongodb
  template:
    metadata:
      labels:
        service: mongodb
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/part-of: robot-shop
    spec:
      containers:
        - name: mongodb
          image: robotshop/rs-mongodb:2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 200Mi
      restartPolicy: Always
