---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: robot-shop
  labels:
    service: user
    app.kubernetes.io/name: user
    app.kubernetes.io/part-of: robot-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      service: user
  template:
    metadata:
      labels:
        service: user
        app.kubernetes.io/name: user
        app.kubernetes.io/part-of: robot-shop
    spec:
      containers:
        - name: user
          image: robotshop/rs-user:2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 50Mi
            limits:
              cpu: 200m
              memory: 100Mi
      restartPolicy: Always
