---
# The schema bootstrap Job runs in robot-shop-bootstrap, but it needs to set
# the ratings and shipping MySQL user passwords to the SAME values ESO delivers
# to the app pods in the robot-shop namespace. A Job cannot read a Secret from
# another namespace, so these two ExternalSecrets pull the same underlying AWS
# Secrets Manager entries into the bootstrap namespace.
#
# Because both the app-side ExternalSecret and this bootstrap-side one extract
# from the identical AWS SM secret, a password rotation stays consistent: the
# next sync sets the DB user password and the app secret to the same new value.
#
# Only MYSQL_PASSWORD is needed here (the Job knows the usernames and databases
# from its own SQL), so nothing else is projected.

apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: ratings-db-bootstrap
  namespace: robot-shop-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: ratings
    app.kubernetes.io/part-of: robot-shop
    app.kubernetes.io/component: bootstrap

spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ratings-db-admin
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: Opaque
      data:
        MYSQL_PASSWORD: "{{ .MYSQL_PASSWORD }}"
  dataFrom:
    - extract:
        key: robot-shop/ratings-db

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: shipping-db-bootstrap
  namespace: robot-shop-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: shipping
    app.kubernetes.io/part-of: robot-shop
    app.kubernetes.io/component: bootstrap

spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: shipping-db-admin
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: Opaque
      data:
        MYSQL_PASSWORD: "{{ .MYSQL_PASSWORD }}"
  dataFrom:
    - extract:
        key: robot-shop/shipping-db