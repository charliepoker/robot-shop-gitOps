---
# ratings is PHP/Symfony and wants a complete PDO DSN string, not a hostname.
#
# The DSN is assembled here rather than stored pre-built in Secrets Manager.
# Its format is an application concern: if the charset changes, or TLS options
# are added in Phase 10, that becomes a one line change in this repo instead of
# a terraform apply against the infrastructure repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: ratings-db
  namespace: robot-shop
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  labels:
    app.kubernetes.io/name: ratings
    app.kubernetes.io/part-of: robot-shop

spec:
  # One hour is the steady state. Phase 7 does not wait for it: rotation is
  # demonstrated with a forced refresh, which is both faster and the honest
  # production answer.
  #   kubectl annotate externalsecret ratings-db -n robot-shop \
  #     force-sync=$(date +%s) --overwrite
  refreshInterval: 1h

  secretStoreRef:
    # Confirm this matches the store created in Phase 2:
    #   kubectl get clustersecretstore
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: ratings-db
    creationPolicy: Owner
    deletionPolicy: Delete

    template:
      engineVersion: v2
      type: Opaque
      data:
        PDO_URL: "mysql:host={{ .MYSQL_HOST }};port={{ .MYSQL_PORT }};dbname={{ .MYSQL_DATABASE }};charset=utf8mb4"
        PDO_USER: "{{ .MYSQL_USERNAME }}"
        PDO_PASSWORD: "{{ .MYSQL_PASSWORD }}"

  dataFrom:
    - extract:
        key: robot-shop/ratings-db