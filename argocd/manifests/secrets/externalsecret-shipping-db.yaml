---
# shipping is Spring Boot. JpaConfig.java builds the JDBC URL itself and appends
# the database name, so DB_HOST must be the bare endpoint with no port and no
# path. Adding a port here produces jdbc:mysql://host:3306:3306/cities.
#
# The database name is carried in the secret for documentation and for the
# bootstrap Job, even though shipping ignores it and hardcodes /cities.
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: shipping-db
  namespace: robot-shop
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: shipping
    app.kubernetes.io/part-of: robot-shop

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: shipping-db
    creationPolicy: Owner
    deletionPolicy: Delete

    template:
      engineVersion: v2
      type: Opaque
      data:
        DB_HOST: "{{ .MYSQL_HOST }}"
        DB_USER: "{{ .MYSQL_USERNAME }}"
        DB_PASSWORD: "{{ .MYSQL_PASSWORD }}"
        DB_NAME: "{{ .MYSQL_DATABASE }}"

  dataFrom:
    - extract:
        key: robot-shop/shipping-db