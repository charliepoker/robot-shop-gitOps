---
# The RDS master credential.
#
# This is the one secret that can create databases and users, so it is confined
# to robot-shop-bootstrap. No application pod ever runs in this namespace, and
# no manifest in the robot-shop namespace references robot-shop/rds-credentials.
#
# Read the caveat: the External Secrets Operator controller holds a single IAM
# identity scoped to robot-shop/*, so the controller itself can technically read
# this secret on behalf of any namespace. The boundary enforced here is that no
# ExternalSecret in robot-shop asks it to. Making that a hard boundary needs a
# second ESO identity and a namespaced SecretStore, recorded as a Phase 10
# hardening item rather than pretended away.
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: rds-master
  namespace: robot-shop-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  labels:
    app.kubernetes.io/name: rds-master
    app.kubernetes.io/part-of: robot-shop
    app.kubernetes.io/component: bootstrap

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: rds-master
    creationPolicy: Owner
    deletionPolicy: Delete

    template:
      engineVersion: v2
      type: Opaque
      data:
        MYSQL_HOST: "{{ .MYSQL_HOST }}"
        MYSQL_PORT: "{{ .MYSQL_PORT }}"
        MYSQL_USERNAME: "{{ .MYSQL_USERNAME }}"
        MYSQL_PASSWORD: "{{ .MYSQL_PASSWORD }}"

  dataFrom:
    - extract:
        key: robot-shop/rds-credentials