---
# The application namespace. Everything a user request touches runs here.
# It never gets access to the RDS master credential.
apiVersion: v1
kind: Namespace
metadata:
  name: robot-shop
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    app.kubernetes.io/name: robot-shop
    app.kubernetes.io/part-of: robot-shop
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# Privileged namespace. The RDS master credential is synced here and nowhere
# else. Only the schema bootstrap Job runs in it, and only during a PreSync
# hook, so nothing long lived shares a namespace with the master password.
apiVersion: v1
kind: Namespace
metadata:
  name: robot-shop-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    app.kubernetes.io/name: robot-shop-bootstrap
    app.kubernetes.io/part-of: robot-shop
    # restricted is enforced here from day one. The bootstrap Job is ours, it
    # runs a plain mysql client, and it has no reason to need root.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted