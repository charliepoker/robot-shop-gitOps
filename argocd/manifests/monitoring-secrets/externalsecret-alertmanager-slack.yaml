# Alertmanager's Slack webhook: AWS Secrets Manager -> ESO -> K8s Secret -> file.
#
# Source:  robot-shop/alertmanager-slack (created by Terraform in
#          modules/secrets-manager/observability-secrets.tf with a PLACEHOLDER; the
#          real URL is set out of band, so it never touches Git or Terraform state).
# Target:  Secret monitoring/alertmanager-slack, key "webhook-url".
#
# Alertmanager reads it as a FILE (slack_configs.api_url_file), mounted from this
# Secret by alertmanagerSpec.secrets in the kube-prometheus-stack Application.
# Nothing sensitive is ever in the Alertmanager config itself.
#
# IMPORTANT ordering: the Alertmanager pod will not start until this Secret
# exists. Apply the Terraform change first, then merge the GitOps change.
#
# Setting or rotating the webhook (no Git change needed):
#   aws secretsmanager put-secret-value --secret-id robot-shop/alertmanager-slack ...
#   kubectl annotate externalsecret alertmanager-slack -n monitoring force-sync=$(date +%s) --overwrite
# The mounted file updates within about a minute and Alertmanager re-reads it each
# time it sends, so no restart is needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alertmanager-slack
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: Opaque
      data:
        webhook-url: "{{ .SLACK_WEBHOOK_URL }}"
  dataFrom:
    - extract:
        key: robot-shop/alertmanager-slack
