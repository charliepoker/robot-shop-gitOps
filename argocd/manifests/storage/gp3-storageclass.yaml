---
  # No kmsKeyId: uses the AWS-managed aws/ebs key. The CSI driver's role lacks
  # CreateGrant on the customer CMK, which makes encrypted volume creation fail
  # with a misleading "InvalidVolume.NotFound". Restoring the CMK is a follow-up
  # that grants the CSI driver role on alias/robot-shop-ebs in modules/kms.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"

