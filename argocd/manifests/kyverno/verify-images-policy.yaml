# Supply-chain admission gate for robot-shop.
#
# Split into two ClusterPolicies because Kyverno's validationFailureAction
# is only configurable at the whole-policy level (per-rule override on a
# verifyImages rule is silently dropped in this Kyverno version — confirmed
# via status.autogen.rules showing it un-set after being applied). Signature
# verification and SBOM-attestation verification need different enforcement,
# so they can no longer live as two rules in one policy.
#
# ── SEQUENCING (read before enforcing) ────────────────────────────────────────
# 1. Ships in AUDIT: reports violations to PolicyReports, blocks NOTHING. Your
#    current Docker Hub pods keep running.
# 2. imageReferences is scoped to YOUR ECR registry only, so Docker Hub images
#    aren't evaluated at all — zero noise until services migrate to ECR.
# 3. Flip a policy to ENFORCE only AFTER:
#      a. cd.yml is signing + attesting ECR images (Tasks 5–6), and
#      b. robot-shop deployments point at those signed ECR digests, and
#      c. the Kyverno SA has ECR read (Pod Identity) so it can fetch signatures.
#    Enforcing before (a)+(c) blocks every ECR pull. You've been warned twice.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: robot-shop-verify-image-signature
  annotations:
    policies.kyverno.io/title: Verify Robot Shop image signatures
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Requires every ECR image in the robot-shop namespace to carry a Cosign
      keyless signature from the robot-shop CD workflow identity.
      Deploy-by-digest is enforced.
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30    # signature fetch + Rekor lookup is slower than a plain policy
  background: false            # required: verifyImages does not run in background scans
  failurePolicy: Ignore        # never fail-closed on a Kyverno hiccup
  rules:
    - name: verify-cosign-keyless-signature
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["robot-shop"]
      verifyImages:
        - imageReferences:
            - "448049792905.dkr.ecr.us-east-1.amazonaws.com/*"
          mutateDigest: true    # pin tag→digest at admission
          verifyDigest: false
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    # Must match the SAN on the Fulcio cert your CD workflow gets.
                    # Adjust if the signing workflow file isn't cd.yml or the
                    # branch isn't master.
                    subjectRegExp: "^https://github\\.com/charliepoker/robot-shop/\\.github/workflows/cd\\.yml@refs/heads/master$"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
---
# Audit, not Enforce: real-world SBOMs (ratings ~2.9MB, shipping ~2.5MB, full
# CycloneDX dependency trees) exceed Kyverno's ~2MiB admission processing
# limit ("context size limit exceeded"). That's a Kyverno capacity limit, not
# a signal the image is untrusted — enforcing it would block every deploy
# whose SBOM happens to be large. Violations still land in PolicyReports for
# visibility. Image signature verification (separate policy above) stays in
# Enforce.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: robot-shop-verify-sbom-attestation
  annotations:
    policies.kyverno.io/title: Verify Robot Shop SBOM attestations
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Requires every ECR image in the robot-shop namespace to carry a
      CycloneDX SBOM attestation from the robot-shop CD workflow identity.
      Audit mode: large SBOMs can exceed Kyverno's admission size limit, so
      violations are reported, not blocked.
spec:
  validationFailureAction: Audit
  webhookTimeoutSeconds: 30
  background: false
  failurePolicy: Ignore
  rules:
    - name: verify-sbom-attestation
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["robot-shop"]
      verifyImages:
        - imageReferences:
            - "448049792905.dkr.ecr.us-east-1.amazonaws.com/*"
          mutateDigest: true
          verifyDigest: false
          required: true
          attestations:
            - type: https://cyclonedx.org/bom   # predicateType from `cosign attest --type cyclonedx`
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        subjectRegExp: "^https://github\\.com/charliepoker/robot-shop/\\.github/workflows/cd\\.yml@refs/heads/master$"
                        issuer: "https://token.actions.githubusercontent.com"
                        rekor:
                          url: https://rekor.sigstore.dev
